# Shared infrastructure: run once in /opt/nginx-proxy-manager, outside app CI/CD.
name: nginx-proxy-manager

services:
  proxy-manager:
    image: jc21/nginx-proxy-manager:2.15.1
    restart: unless-stopped
    ports:
      - "${NPM_BIND_IP:-0.0.0.0}:${NPM_HTTP_PORT:-80}:80"
      - "${NPM_BIND_IP:-0.0.0.0}:${NPM_HTTPS_PORT:-443}:443"
      - "127.0.0.1:81:81"
    volumes:
      - npm-data:/data
      - letsencrypt:/etc/letsencrypt
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: proxy

volumes:
  npm-data:
  letsencrypt:
