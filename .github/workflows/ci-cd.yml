name: Meta Education CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an active deployment with the next push.
concurrency:
  group: meta-education-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meta_education
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: meta_education_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meta_education -d meta_education_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
      - name: Validate types and Compose
        run: |
          pnpm exec next typegen
          pnpm typecheck
          docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
          docker compose -f deploy/proxy/compose.yaml config --quiet
      - name: Run application tests with PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://meta_education:ci-test-password@127.0.0.1:5432/meta_education_test
        run: pnpm test
      - name: Check production build for pull requests
        if: github.event_name == 'pull_request'
        run: pnpm build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Sync source and start Docker Compose
        env:
          GH_TOKEN: ${{ github.token }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          # Confirmed on this VPS with pwd -P; independent of repository Variables.
          DEPLOY_ROOT: /home/maggalon/meta-education
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          stage='checking GitHub and deployment settings'
          trap 'echo "::error::Deployment failed while $stage (line $LINENO). See the error above." >&2' ERR
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha') || fail 'Cannot read the current main commit from GitHub.'
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo 'A newer main commit exists; this deployment is skipped.'
            exit 0
          fi
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || fail 'VPS_HOST must contain only an IPv4 address or hostname, without spaces, protocol or port.'
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || fail 'VPS_USER must contain only the SSH username, without spaces or @host.'
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || fail 'VPS_SSH_PORT must contain only digits.'
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_-]+(/[a-zA-Z0-9_-]+)*$ ]] || fail 'DEPLOY_ROOT must be an absolute path, without ~, spaces or a trailing slash. Run pwd -P in the project directory on the VPS.'
          test -n "$SSH_KEY" || fail 'VPS_SSH_KEY is empty or unavailable. Add it to repository Actions Secrets.'
          test -n "$KNOWN_HOSTS" || fail 'VPS_KNOWN_HOSTS is empty or unavailable. Add it to repository Actions Secrets.'
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          ssh_args=(-i "$RUNNER_TEMP/deploy_key" -p "$VPS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          target="$VPS_USER@$VPS_HOST"
          stage='connecting over SSH and checking the server'
          echo 'Connecting over SSH and checking the deployment directory...'
          # DEPLOY_ROOT is validated above and intentionally expands on the runner.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$target" "bash -s -- '$DEPLOY_ROOT'" <<'REMOTE'
          set -euo pipefail
          fail() { echo "::error::$1" >&2; exit 1; }
          deploy_root=$1
          echo 'SSH connected. Checking server prerequisites...'
          printf 'SSH user: %s; starting directory: %s\n' "$(id -un)" "$(pwd -P)"
          printf 'Deployment path: %s\n' "$deploy_root"
          if ! test -d "$deploy_root"; then
            ls -ld -- "$deploy_root" >&2 || true
            fail "Deployment directory does not exist or is inaccessible: $deploy_root. Check the SSH user, server and DEPLOY_ROOT in the workflow."
          fi
          test -f "$deploy_root/.env.production" || fail "Missing or inaccessible configuration: $deploy_root/.env.production. Place it above app/, not inside app/."
          test -r "$deploy_root/.env.production" || fail "The SSH user cannot read $deploy_root/.env.production. Check its owner and permissions."
          command -v docker >/dev/null || fail 'Docker is not available to the SSH user.'
          docker info >/dev/null || fail 'The SSH user cannot access the Docker daemon without sudo. Check Docker service and docker group membership.'
          docker compose version >/dev/null || fail 'Docker Compose v2 is not available.'
          command -v rsync >/dev/null || fail 'rsync is not installed on the VPS.'
          docker network inspect proxy >/dev/null || fail 'Docker network proxy is missing. Complete the Nginx Proxy Manager setup.'
          mkdir -p "$deploy_root/app" || fail "Cannot create $deploy_root/app. Check directory ownership."
          test -w "$deploy_root/app" || fail "The SSH user cannot write to $deploy_root/app. Check directory ownership."
          echo 'Server prerequisites passed.'
          REMOTE
          printf -v RSYNC_RSH '%q ' ssh "${ssh_args[@]}"
          export RSYNC_RSH
          stage='syncing source files with rsync'
          echo 'Syncing source files...'
          # This checkout has no build artifacts. Keep secrets outside app/.
          rsync -az --delete --exclude='/.git/' --exclude='/.env*' ./ "$target:$DEPLOY_ROOT/app/"
          stage='building and starting Docker Compose on the VPS'
          echo 'Building and starting Docker Compose...'
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "$target" "cd '$DEPLOY_ROOT/app' && docker compose --env-file ../.env.production -f compose.production.yaml up -d --build --wait --wait-timeout 180"
      - name: Remove temporary SSH files
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
